services:
  - type: web
    name: popref-core-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POPREF_API_SECRET
        generateValue: true
    healthCheckPath: /health
